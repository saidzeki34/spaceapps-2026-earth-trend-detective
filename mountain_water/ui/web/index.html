<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RivaScope</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Loading screen -->
<div id="splash" class="splash" role="status" aria-live="polite">
  <svg class="mark" viewBox="0 0 64 64" width="44" height="44" fill="none" aria-hidden="true">
    <rect x="6" y="6" width="52" height="52"/>
    <path d="M12 44 L26 20 L33 31 L40 24 L52 44"/>
    <path class="mark-river" d="M33 31 L29 40 L36 47 L32 58"/>
  </svg>
  <div class="splash-word">RivaScope</div>
  <div class="splash-foot">
    <div class="splash-bar"><i></i></div>
    <p><span>Mountain river water availability</span><span id="splash-status">Loading saved results</span></p>
  </div>
</div>

<!-- Occupation menu: shown after the loading screen until a choice has been saved -->
<main id="occupation" class="pick" hidden>
  <header>
    <span class="brand">
      <svg class="mark" viewBox="0 0 64 64" width="20" height="20" fill="none" aria-hidden="true">
        <rect x="6" y="6" width="52" height="52"/>
        <path d="M12 44 L26 20 L33 31 L40 24 L52 44"/>
        <path class="mark-river" d="M33 31 L29 40 L36 47 L32 58"/>
      </svg>RivaScope</span>
    <span>Occupation</span>
  </header>
  <ol id="choices"></ol>
  <footer><span id="pick-data"></span><button data-action="about">Data</button></footer>
</main>

<!-- The app -->
<div id="app" hidden>
  <header class="top">
    <button class="brand" data-action="europe" title="Europe">
      <svg class="mark" viewBox="0 0 64 64" width="20" height="20" fill="none" aria-hidden="true">
        <rect x="6" y="6" width="52" height="52"/>
        <path d="M12 44 L26 20 L33 31 L40 24 L52 44"/>
        <path class="mark-river" d="M33 31 L29 40 L36 47 L32 58"/>
      </svg>RivaScope</button>
    <nav class="crumbs" id="crumbs" aria-label="Location"></nav>
    <div class="top-right">
      <label>Occupation<select id="occupation-select"></select></label>
      <button data-action="about">Data</button>
    </div>
  </header>

  <div class="layout" id="layout">
    <aside class="side" id="side"></aside>
    <section class="mapwrap" aria-label="Map"><div id="map"></div><button class="map-back results-reopen" data-action="show-results" aria-controls="results" aria-expanded="false" hidden>Results</button></section>
    <div class="grip" id="grip" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
    <section class="res" id="results" aria-live="polite"></section>
    <div class="time" id="timeline"></div>
  </div>
</div>

<dialog id="about" class="about">
  <header><h2>Data</h2><form method="dialog"><button>Close</button></form></header>
  <div id="about-body"></div>
</dialog>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/plotly.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
