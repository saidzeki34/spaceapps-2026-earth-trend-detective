[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mountain-water"
version = "0.1.0"
description = "Evidence-led mountain catchment flow assessment for NASA Space Apps 2026"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit>=1.45,<2", "pandas>=2.2,<3", "numpy>=2,<3",
  "scipy>=1.14,<2", "plotly>=6,<7", "httpx>=0.28,<1",
  "python-dotenv>=1,<2", "earthengine-api>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
catalogue = ["pyshp>=2.3,<4", "pyproj>=3.6,<4"]

[tool.setuptools.packages.find]
include = ["mountain_water*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
