[project]
name = "mountain-water"
version = "0.1.0"
description = "Mountain water availability: CAMELS-CH trend analysis (NASA Space Apps 2026)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "pymannkendall>=1.4.3",
    "plotly>=6.0",
    "requests>=2.31",
    "pyshp>=2.3",
    "pyproj>=3.6",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mountain_water*"]
